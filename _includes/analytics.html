<script
  src="https://js.monitor.azure.com/scripts/b/ai.3.gbl.min.js"
  crossorigin="anonymous">
</script>

<script>
  (function () {
    const connectionString = "InstrumentationKey=db80adfe-d918-4768-b152-73bb9aa128da;IngestionEndpoint=https://australiasoutheast-0.in.applicationinsights.azure.com/;LiveEndpoint=https://australiasoutheast.livediagnostics.monitor.azure.com/;ApplicationId=2d42d0a8-b61c-4618-9c1e-694e278b9b5c";

    if (
      !connectionString ||
      connectionString.includes("PASTE-YOUR")
    ) {
      console.warn("SOP analytics: Application Insights connection string has not been configured.");
      return;
    }

    if (
      !window.Microsoft ||
      !Microsoft.ApplicationInsights ||
      !Microsoft.ApplicationInsights.ApplicationInsights
    ) {
      console.warn("SOP analytics: Application Insights SDK could not be loaded.");
      return;
    }

    const appInsights =
      new Microsoft.ApplicationInsights.ApplicationInsights({
        config: {
          connectionString: connectionString,

          /*
           * Records page visit duration for the previous
           * instrumented page when another page view occurs.
           */
          autoTrackPageVisitTime: true,

          /*
           * This is a normal multi-page Jekyll website,
           * not a single-page application.
           */
          enableAutoRouteTracking: false
        }
      });

    appInsights.loadAppInsights();

    const SESSION_KEY = "sop_analytics_session_id";
    const TRAFFIC_KEY = "sop_analytics_traffic_source";

    function createId() {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ) {
        return window.crypto.randomUUID();
      }

      return (
        Date.now().toString(36) +
        "-" +
        Math.random().toString(36).slice(2, 12)
      );
    }

    function getSessionId() {
      let sessionId =
        window.sessionStorage.getItem(
          SESSION_KEY
        );

      if (!sessionId) {
        sessionId = createId();

        window.sessionStorage.setItem(
          SESSION_KEY,
          sessionId
        );
      }

      return sessionId;
    }

    function getDeviceClass() {
      const width =
        window.innerWidth ||
        document.documentElement.clientWidth ||
        0;

      if (width <= 767) {
        return "mobile";
      }

      if (width <= 1024) {
        return "tablet";
      }

      return "desktop";
    }

    function getTrafficSource() {
      const params =
        new URLSearchParams(
          window.location.search
        );

      const existing =
        window.sessionStorage.getItem(
          TRAFFIC_KEY
        );

      if (existing) {
        try {
          return JSON.parse(existing);
        } catch (error) {
          // Replace malformed stored value below.
        }
      }

      const utmSource =
        params.get("utm_source") || "";

      const utmMedium =
        params.get("utm_medium") || "";

      const utmCampaign =
        params.get("utm_campaign") || "";

      const utmContent =
        params.get("utm_content") || "";

      const utmTerm =
        params.get("utm_term") || "";

      const referrer =
        document.referrer || "";

      let source = "direct";
      let medium = "none";

      if (utmSource) {
        source = utmSource;
        medium = utmMedium || "campaign";
      } else if (referrer) {
        try {
          const referrerUrl =
            new URL(referrer);

          if (
            referrerUrl.hostname !==
            window.location.hostname
          ) {
            source =
              referrerUrl.hostname;

            medium =
              "referral";
          } else {
            source =
              "internal";

            medium =
              "internal";
          }
        } catch (error) {
          source = "referral";
          medium = "referral";
        }
      }

      const traffic = {
        source: source,
        medium: medium,
        campaign: utmCampaign,
        content: utmContent,
        term: utmTerm,
        referrer: referrer
      };

      window.sessionStorage.setItem(
        TRAFFIC_KEY,
        JSON.stringify(traffic)
      );

      return traffic;
    }

    function getCommonProperties() {
      const traffic =
        getTrafficSource();

      return {
        component: "sops-web",

        session_id:
          getSessionId(),

        page_path:
          window.location.pathname,

        page_title:
          document.title || "",

        page_url:
          window.location.href,

        traffic_source:
          traffic.source,

        traffic_medium:
          traffic.medium,

        traffic_campaign:
          traffic.campaign,

        traffic_content:
          traffic.content,

        traffic_term:
          traffic.term,

        initial_referrer:
          traffic.referrer,

        device_class:
          getDeviceClass()
      };
    }

    function trackEvent(name, properties) {
      const eventProperties =
        Object.assign(
          {},
          getCommonProperties(),
          properties || {}
        );

      appInsights.trackEvent(
        {
          name: name
        },
        eventProperties
      );
    }

    function trackPageView() {
      appInsights.trackPageView({
        name:
          document.title ||
          window.location.pathname,

        uri:
          window.location.href,

        properties:
          getCommonProperties()
      });
    }

    /*
     * Make a small analytics API available to the
     * rest of the SOP website.
     *
     * banner.html, QR functions and print functions
     * can use this later without knowing anything
     * about Application Insights itself.
     */
    window.sopAnalytics = {
      appInsights: appInsights,

      trackEvent:
        trackEvent,

      trackPageView:
        trackPageView,

      getSessionId:
        getSessionId,

      getCommonProperties:
        getCommonProperties
    };

    /*
     * Initial page view.
     */
    trackPageView();
  })();
</script>
