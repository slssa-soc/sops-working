<script
  src="https://js.monitor.azure.com/scripts/b/ai.3.gbl.min.js"
  crossorigin="anonymous">
</script>

<script>
  (function () {
    const connectionString = "InstrumentationKey=db80adfe-d918-4768-b152-73bb9aa128da;IngestionEndpoint=https://australiasoutheast-0.in.applicationinsights.azure.com/;LiveEndpoint=https://australiasoutheast.livediagnostics.monitor.azure.com/;ApplicationId=2d42d0a8-b61c-4618-9c1e-694e278b9b5c";

    if (!connectionString || connectionString.includes("PASTE-YOUR")) {
      console.warn("SOP analytics: Application Insights connection string has not been configured.");
      return;
    }

    if (
      !window.Microsoft ||
      !Microsoft.ApplicationInsights ||
      !Microsoft.ApplicationInsights.ApplicationInsights
    ) {
      console.warn("SOP analytics: Application Insights SDK could not be loaded.");
      return;
    }

    const appInsights = new Microsoft.ApplicationInsights.ApplicationInsights({
      config: {
        connectionString: connectionString,
        autoTrackPageVisitTime: true,
        enableAutoRouteTracking: false
      }
    });

    appInsights.loadAppInsights();

    const SESSION_KEY = "sop_analytics_session_id";
    const TRAFFIC_KEY = "sop_analytics_traffic_source";
    const ATTRIBUTION_PREFIX = "sop_analytics_attribution_";

    let visibleStartedAt = null;
    let totalVisibleMilliseconds = 0;
    let printEventActive = false;

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
    }

    function getSessionId() {
      let sessionId = window.sessionStorage.getItem(SESSION_KEY);

      if (!sessionId) {
        sessionId = createId();
        window.sessionStorage.setItem(SESSION_KEY, sessionId);
      }

      return sessionId;
    }

    function getDeviceClass() {
      const width = window.innerWidth || document.documentElement.clientWidth || 0;

      if (width <= 767) {
        return "mobile";
      }

      if (width <= 1024) {
        return "tablet";
      }

      return "desktop";
    }

    function getCurrentCampaign() {
      const params = new URLSearchParams(window.location.search);

      return {
        source: params.get("utm_source") || "",
        medium: params.get("utm_medium") || "",
        campaign: params.get("utm_campaign") || "",
        content: params.get("utm_content") || "",
        term: params.get("utm_term") || ""
      };
    }

    function getTrafficSource() {
      const params = new URLSearchParams(window.location.search);
      const existing = window.sessionStorage.getItem(TRAFFIC_KEY);

      if (existing) {
        try {
          return JSON.parse(existing);
        } catch (error) {
          // Replace malformed stored value below.
        }
      }

      const utmSource = params.get("utm_source") || "";
      const utmMedium = params.get("utm_medium") || "";
      const utmCampaign = params.get("utm_campaign") || "";
      const utmContent = params.get("utm_content") || "";
      const utmTerm = params.get("utm_term") || "";
      const referrer = document.referrer || "";

      let source = "direct";
      let medium = "none";

      if (utmSource) {
        source = utmSource;
        medium = utmMedium || "campaign";
      } else if (referrer) {
        try {
          const referrerUrl = new URL(referrer);

          if (referrerUrl.hostname !== window.location.hostname) {
            source = referrerUrl.hostname;
            medium = "referral";
          } else {
            source = "internal";
            medium = "internal";
          }
        } catch (error) {
          source = "referral";
          medium = "referral";
        }
      }

      const traffic = {
        source: source,
        medium: medium,
        campaign: utmCampaign,
        content: utmContent,
        term: utmTerm,
        referrer: referrer,
        landing_path: window.location.pathname
      };

      window.sessionStorage.setItem(TRAFFIC_KEY, JSON.stringify(traffic));
      return traffic;
    }

    function getCommonProperties() {
      const traffic = getTrafficSource();
      const currentCampaign = getCurrentCampaign();

      return {
        component: "sops-web",
        session_id: getSessionId(),
        page_path: window.location.pathname,
        page_title: document.title || "",
        page_url: window.location.href,
        traffic_source: traffic.source,
        traffic_medium: traffic.medium,
        traffic_campaign: traffic.campaign,
        traffic_content: traffic.content,
        traffic_term: traffic.term,
        initial_referrer: traffic.referrer,
        landing_path: traffic.landing_path || "",
        current_utm_source: currentCampaign.source,
        current_utm_medium: currentCampaign.medium,
        current_utm_campaign: currentCampaign.campaign,
        current_utm_content: currentCampaign.content,
        current_utm_term: currentCampaign.term,
        device_class: getDeviceClass()
      };
    }

    function trackEvent(name, properties) {
      const eventProperties = Object.assign({}, getCommonProperties(), properties || {});

      appInsights.trackEvent(
        {
          name: name
        },
        eventProperties
      );
    }

    function trackPageView() {
      appInsights.trackPageView({
        name: document.title || window.location.pathname,
        uri: window.location.href,
        properties: getCommonProperties()
      });
    }

    function trackAttributionVisit() {
      const campaign = getCurrentCampaign();

      if (!campaign.source) {
        return;
      }

      const attributionKey = [
        ATTRIBUTION_PREFIX,
        campaign.source,
        window.location.pathname,
        campaign.campaign || "none"
      ].join("|");

      if (window.sessionStorage.getItem(attributionKey)) {
        return;
      }

      window.sessionStorage.setItem(attributionKey, "1");

      if (campaign.source === "sop_qr" || campaign.source === "sop_print_qr") {
        trackEvent("sop_qr_scan", {
          qr_source: campaign.source,
          attribution_medium: campaign.medium || "qr",
          attribution_campaign: campaign.campaign || ""
        });
        return;
      }

      if (campaign.source === "sop_copy_link") {
        trackEvent("sop_copy_link_visit", {
          attribution_source: campaign.source,
          attribution_medium: campaign.medium || "share",
          attribution_campaign: campaign.campaign || ""
        });
        return;
      }

      trackEvent("campaign_landing", {
        attribution_source: campaign.source,
        attribution_medium: campaign.medium,
        attribution_campaign: campaign.campaign
      });
    }

    /* ---------------------------------------------------------
     * ACTIVE READING TIME
     * --------------------------------------------------------- */

    function startVisibleTimer() {
      if (visibleStartedAt !== null) {
        return;
      }

      visibleStartedAt = Date.now();
    }

    function stopVisibleTimer() {
      if (visibleStartedAt === null) {
        return 0;
      }

      const elapsed = Date.now() - visibleStartedAt;
      totalVisibleMilliseconds += elapsed;
      visibleStartedAt = null;
      return elapsed;
    }

    function trackEngagementSegment(reason) {
      const segmentMilliseconds = stopVisibleTimer();

      if (segmentMilliseconds <= 0) {
        return;
      }

      const segmentSeconds = Math.round(segmentMilliseconds / 1000);
      const totalVisibleSeconds = Math.round(totalVisibleMilliseconds / 1000);

      if (segmentSeconds < 1) {
        return;
      }

      trackEvent("page_engagement", {
        segment_seconds: segmentSeconds,
        total_visible_seconds: totalVisibleSeconds,
        engagement_reason: reason
      });
    }

    if (document.visibilityState === "visible") {
      startVisibleTimer();
    }

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        trackEngagementSegment("tab_hidden");
      } else {
        startVisibleTimer();
      }
    });

    window.addEventListener("pagehide", function () {
      trackEngagementSegment("page_exit");

      if (typeof appInsights.flush === "function") {
        appInsights.flush();
      }
    });

    /* ---------------------------------------------------------
     * PRINT TRACKING
     * --------------------------------------------------------- */

    window.addEventListener("beforeprint", function () {
      if (printEventActive) {
        return;
      }

      printEventActive = true;

      trackEvent("sop_print", {
        print_status: "initiated"
      });
    });

    window.addEventListener("afterprint", function () {
      printEventActive = false;
    });

    /* ---------------------------------------------------------
     * CLICK / NAVIGATION TRACKING
     * --------------------------------------------------------- */

    function cleanText(value) {
      return String(value || "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 160);
    }

    function getElementLabel(element) {
      return cleanText(
        element.getAttribute("aria-label") ||
        element.getAttribute("title") ||
        element.innerText ||
        element.textContent ||
        ""
      );
    }

    function getLinkType(url) {
      if (!url) {
        return "unknown";
      }

      if (url.protocol === "mailto:") {
        return "email";
      }

      if (url.protocol === "tel:") {
        return "telephone";
      }

      if (url.hostname === window.location.hostname) {
        return "internal";
      }

      return "external";
    }

    document.addEventListener(
      "click",
      function (event) {
        const specificControl = event.target.closest('[data-analytics-specific="true"]');

        if (specificControl) {
          return;
        }

        const link = event.target.closest("a");

        if (link) {
          const href = link.getAttribute("href") || "";

          if (!href || href === "#" || href.startsWith("javascript:") || href.startsWith("data:")) {
            return;
          }

          let destinationUrl;

          try {
            destinationUrl = new URL(href, window.location.href);
          } catch (error) {
            return;
          }

          const linkType = getLinkType(destinationUrl);
          const properties = {
            from_path: window.location.pathname,
            link_text: getElementLabel(link),
            link_type: linkType,
            target: link.getAttribute("target") || "_self"
          };

          if (linkType === "internal") {
            properties.to_path = destinationUrl.pathname;
          } else if (linkType === "external") {
            properties.destination_host = destinationUrl.hostname;
            properties.destination_path = destinationUrl.pathname;
          } else {
            properties.destination_scheme = destinationUrl.protocol.replace(":", "");
          }

          trackEvent("navigation_click", properties);
          return;
        }

        const button = event.target.closest('button, [role="button"]');

        if (!button) {
          return;
        }

        const label = getElementLabel(button);

        if (!label) {
          return;
        }

        trackEvent("button_click", {
          button_label: label,
          button_id: button.id || "",
          button_name: button.getAttribute("name") || ""
        });
      },
      true
    );

    /* ---------------------------------------------------------
     * PUBLIC ANALYTICS API
     * --------------------------------------------------------- */

    window.sopAnalytics = {
      appInsights: appInsights,
      trackEvent: trackEvent,
      trackPageView: trackPageView,
      getSessionId: getSessionId,
      getCommonProperties: getCommonProperties
    };

    trackPageView();
    trackAttributionVisit();
  })();
</script>
